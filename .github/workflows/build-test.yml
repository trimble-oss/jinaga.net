name: "Build and Test"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jinaga
          POSTGRES_PASSWORD: jinaga_test
          POSTGRES_DB: jinaga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jinaga -d jinaga_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: "0"

    - name: Setup .NET Core 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x.x

    - name: Set up GitHub Packages authentication
      run: |
        dotnet nuget update source "GitHub" --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: |
        dotnet build Jinaga --no-restore
        dotnet build Jinaga.UnitTest --no-restore
        dotnet build Jinaga.Test --no-restore
        dotnet build Jinaga.Notebooks --no-restore
        dotnet build Jinaga.Tool --no-restore
        dotnet build Jinaga.Store.SQLite --no-restore
        dotnet build Jinaga.Store.SQLite.Test --no-restore
        dotnet build Jinaga.Store.PostgreSQL --no-restore
        dotnet build Jinaga.Store.PostgreSQL.Test --no-restore
        dotnet build Jinaga.Maui --no-restore

    - name: Test
      env:
        JINAGA_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=jinaga_test;Username=jinaga;Password=jinaga_test"
      run: |
        dotnet test Jinaga.Test --no-build --verbosity normal
        dotnet test Jinaga.Store.SQLite.Test --no-build --verbosity normal
        dotnet test Jinaga.Store.PostgreSQL.Test --no-build --verbosity normal